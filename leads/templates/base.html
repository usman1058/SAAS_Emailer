<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}SAAS Emailer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto 60px;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: #fff;
            border: none;
        }

        .card-header {
            background-color: #f68a0a;
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 0;
            border: none;
        }

        .card-header h3 { margin: 0; display: flex; align-items: center; gap: 10px; }
        .card-header h3 span { font-size: 1.6rem; }

        .card-body { padding: 24px; }

        label.form-label {
            font-weight: 600;
            color: #f68a0a;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 10px 14px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #f68a0a;
            box-shadow: 0 0 12px rgba(246, 138, 10, 0.3);
            outline: none;
        }

        .form-text { font-size: 0.85rem; color: #6c757d; margin-top: 4px; }
        .form-text code { background: #f1f3f4; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }

        button.btn-success, button.btn-primary, button.btn-danger, button.btn-info, button.btn-secondary {
            font-weight: 700;
            padding: 12px 26px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        button.btn-success { background-color: #f68a0a; border: none; color: white; }
        button.btn-success:hover { background-color: #c76a00; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(199, 106, 0, 0.4); }
        button.btn-primary { background-color: #0d6efd; border: none; }
        button.btn-primary:hover { background-color: #0b5ed7; }
        button.btn-danger { background-color: #dc3545; border: none; }
        button.btn-danger:hover { background-color: #b02a37; }
        button.btn-info { background-color: #0dcaf0; border: none; color: #000; }
        button.btn-info:hover { background-color: #0bb5d8; }
        button.btn-secondary { background-color: #6c757d; border: none; }
        button.btn-secondary:hover { background-color: #5c636a; }

        .badge { font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; }
        .badge-pending { background: #6c757d; }
        .badge-running { background: #0dcaf0; color: #000; }
        .badge-completed { background: #198754; }
        .badge-failed { background: #dc3545; }
        .badge-stopped { background: #ffc107; color: #000; }

        .table th { background: #f8f9fa; font-weight: 600; border-top: none; }
        .table td { vertical-align: middle; }
        .table tbody tr:hover { background: #fafafa; }

        .progress-bar-custom {
            height: 8px;
            border-radius: 4px;
            background: #e9ecef;
            overflow: hidden;
            width: 120px;
        }

        .progress-bar-custom .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f68a0a, #ffa500);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .leads-table td { font-size: 0.9rem; }
        .leads-table .text-truncate { max-width: 250px; }

        @media (max-width: 768px) {
            .container { margin: 20px auto 40px; padding: 0 12px; }
            .card-body { padding: 16px; }
        }

        .spinner-border-sm { width: 1rem; height: 1rem; }
        .text-muted { color: #6c757d !important; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
